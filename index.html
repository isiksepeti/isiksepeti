<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Işık Sepeti</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f6f6f6;
  color:#222;
}

/* HEADER */
header{
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* LOGO ICON */
.logo-box{
  width:34px;
  height:34px;
  border:2px solid #001f4d;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:10px;
}

.logo-dot{
  width:10px;
  height:14px;
  border:2px solid #001f4d;
  border-bottom:none;
  border-radius:6px 6px 0 0;
  position:relative;
}

.logo-dot::after{
  content:"";
  width:4px;
  height:4px;
  background:#001f4d;
  border-radius:50%;
  position:absolute;
  bottom:-6px;
  left:3px;
}

/* TITLE */
h1{
  margin:0;
  font-size:26px;
}

h1 span:first-child{color:#222;}
h1 span:last-child{color:#001f4d;}

/* HERO */
.hero{
  background:white;
  text-align:center;
  padding:60px 20px;
}

.hero h2{
  color:#001f4d;
  font-size:24px;
}

/* BUTTONS */
.btn{
  display:inline-block;
  padding:12px 20px;
  margin:10px;
  border-radius:8px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  background:#001f4d;
}

/* SECTIONS */
.section{
  text-align:center;
  padding:40px 20px;
}

.card{
  display:inline-block;
  background:white;
  padding:20px;
  margin:10px;
  border-radius:10px;
  width:200px;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <div class="logo-dot"></div>
  </div>

  <h1>
    <span>IŞIK</span>
    <span>SEPETİ</span>
  </h1>
</header>

<div class="hero">
  <h2>Her Tarza ve Her Bütçeye Aydınlatma Çözümleri</h2>

  <a class="btn" href="https://wa.me/90XXXXXXXXXX">WhatsApp Sipariş</a>
  <a class="btn" href="https://instagram.com/isik.sepeti">Instagram</a>
</div>

<div class="section">
  <div class="card">Avizeler</div>
  <div class="card">Lambaderler</div>
  <div class="card">Aplikler</div>
  <div class="card">LED Aydınlatma</div>
</div>

</body>
</html>
